syntax = "proto3";

message Airport {
  string airport = 2;
}

message SelectedFlight {
  string from_airport = 1;
  string date = 2;
  string to_airport = 3;
  string airline = 5;
  string flight_number = 6;
}

message FlightData {
  string date = 2;
  repeated SelectedFlight selected_flights = 4;
  optional int32 max_stops = 5;
  repeated string airlines = 6;
  Airport from_airport = 13;
  Airport to_airport = 14;
}

enum Seat {
  UNKNOWN_SEAT = 0;
  ECONOMY = 1;
  PREMIUM_ECONOMY = 2;
  BUSINESS = 3;
  FIRST = 4;
}

enum Trip {
  UNKNOWN_TRIP = 0;
  ROUND_TRIP = 1;
  ONE_WAY = 2;
  MULTI_CITY = 3;
}

enum Passenger {
  UNKNOWN_PASSENGER = 0;
  ADULT = 1;
  CHILD = 2;
  INFANT_IN_SEAT = 3;
  INFANT_ON_LAP = 4;
}

message Info {
  repeated FlightData data = 3;
  repeated Passenger passengers = 8;
  Seat seat = 9;
  Trip trip = 19;
}
